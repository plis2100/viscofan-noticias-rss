name: Actualizar RSS de Viscofan

on:
  workflow_dispatch:

  schedule:
    # GitHub utiliza UTC.
    # Se lanzan las horas necesarias para cubrir el horario
    # de verano y de invierno de España.
    # El programa acepta únicamente las 07:00, 13:00 y 19:00.
    - cron: "17 5,6,11,12,17,18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-viscofan
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el RSS."
          else
            git commit -m "Actualizar RSS de Viscofan"
            git push
          fi
